services:
  mosquitto:
    build: mosquitto/.
    container_name: mosquitto
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
    networks:
      - thalamus-network
    restart: always

  portainer:
    build: portainer/.
    container_name: portainer
    command: --admin-password-file /tmp/portainer_password
    ports:
      - 9443:9443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
      - ./portainer/config/portainer_password:/tmp/portainer_password:ro
    networks:
      - thalamus-network
    restart: always

networks:
  thalamus-network:
    name: thalamus-network
    driver: bridge

volumes:
  portainer_data:
    name: thalamus-portainer-data
  mosquitto-data:
    name: thalamus-mosquitto-data
  mosquitto-log:
    name: thalamus-mosquitto-log
